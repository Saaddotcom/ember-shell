# Ember Shell - window rules
# Uses the Hyprland 0.53+ windowrule syntax.
# Documentation: https://wiki.hypr.land/Configuring/Window-Rules/

# Scratchpad terminal: floating, centered, and kept on the magic workspace.
windowrule = match:class ^(scratchpad)$, workspace special:magic silent
windowrule = match:class ^(scratchpad)$, float on
windowrule = match:class ^(scratchpad)$, size 900 560
windowrule = match:class ^(scratchpad)$, center on

# Generated keybind cheatsheet window.
windowrule = match:class ^(cheatsheet)$, float on
windowrule = match:class ^(cheatsheet)$, size 760 620
windowrule = match:class ^(cheatsheet)$, center on

# Example: float and size a settings window.
# windowrule = match:class ^(pavucontrol)$, float on
