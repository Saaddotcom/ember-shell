# Ember Shell - Hyprland entry point
# Install this directory at ~/.config/hypr and keep the sourced files together.

# Core programs. Change these if your tools use different command names.
$mainMod = SUPER
$terminal = kitty

# Blur is off by default to keep GPU and memory use low.
# Set this to true to enable the blur block in looks.conf.
$blur = false

# Load the focused pieces of the configuration.
# colors.conf has a fallback in this repo and is rewritten by Matugen.
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/colors.conf
source = ~/.config/hypr/looks.conf
source = ~/.config/hypr/anims.conf
source = ~/.config/hypr/rules.conf
source = ~/.config/hypr/binds.conf

# Keep the startup list deliberately small.
exec-once = waybar
exec-once = hyprpaper
