# Ember Shell - surfaces
# $blur is defined in hyprland.conf so it can be toggled in one place.

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = $active_border
    col.inactive_border = $inactive_border
    layout = dwindle
    resize_on_border = false
    allow_tearing = false
}

decoration {
    rounding = 10
    active_opacity = 0.96
    inactive_opacity = 0.88
    fullscreen_opacity = 1.0

    blur {
        enabled = $blur
        size = 3
        passes = 1
    }

    shadow {
        enabled = false
    }
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

debug {
    vfr = true
}

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
    }
}
