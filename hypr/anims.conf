# Ember Shell - motion
# Speed is measured in deciseconds: 1.5 = 150 ms, 1.8 = 180 ms.

animations {
    enabled = true
    bezier = ember, 0.25, 0.1, 0.25, 1.0
    animation = windows, 1, 1.5, ember
    animation = windowsOut, 1, 1.5, ember, popin 92%
    animation = fade, 1, 1.5, ember
    animation = workspaces, 1, 1.8, ember, slide
    animation = border, 1, 1.5, ember
}
