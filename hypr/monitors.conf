# Find your output names with:
#   hyprctl monitors
#
# This fallback rule detects every connected display, uses its preferred mode,
# places it automatically, and lets Hyprland choose a sensible scale.
monitor = , preferred, auto, auto

# To pin a 1366x768 laptop panel, copy the line below, remove the leading "#",
# and replace YOUR-OUTPUT with the name reported by `hyprctl monitors`.
# monitor = YOUR-OUTPUT, 1366x768@60, 0x0, 1
