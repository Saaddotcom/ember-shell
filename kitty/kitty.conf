# Ember Shell - Kitty terminal
# Matugen writes colors.conf at runtime; the bundled file is a safe fallback.

include colors.conf

# Typography
font_family JetBrainsMono Nerd Font
bold_font auto
italic_font auto
font_size 11.0

# Window
background_opacity 0.96
dynamic_background_opacity yes
background_blur 0
window_padding_width 12 16
hide_window_decorations yes
confirm_os_window_close 0

# Tabs
tab_bar_style powerline
tab_powerline_style round
tab_bar_min_tabs 2

# Behaviour
scrollback_lines 2000
enable_audio_bell no
copy_on_select yes
cursor_shape beam
cursor_blink_interval 0
mouse_hide_wait 2.0
